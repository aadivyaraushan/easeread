<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseRead</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img class="brand-icon" src="../icons/icon-64.png" alt="" width="32" height="32">
        <div class="brand-copy">
          <h1 class="heading-6">EaseRead</h1>
          <p class="caption-4 site-label" id="site-label">Ready on this page</p>
        </div>
      </div>

      <label class="switch" aria-label="Enable EaseRead on this page">
        <input type="checkbox" id="toggle-active" checked>
        <span class="switch-track">
          <span class="switch-thumb"></span>
        </span>
      </label>
    </header>

    <button type="button" class="reader-cta button-sm" id="btn-reader">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 5.5C3 4.67 3.67 4 4.5 4H8C9.93 4 11.5 5.57 11.5 7.5V19.5C11.5 18.4 10.6 17.5 9.5 17.5H4.5C3.67 17.5 3 16.83 3 16V5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M21 5.5C21 4.67 20.33 4 19.5 4H16C14.07 4 12.5 5.57 12.5 7.5V19.5C12.5 18.4 13.4 17.5 14.5 17.5H19.5C20.33 17.5 21 16.83 21 16V5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span id="btn-reader-label">Open Clean Reader View</span>
    </button>

    <section class="card" aria-labelledby="presets-heading">
      <div class="card-head">
        <h2 class="title-4" id="presets-heading">Quick Presets</h2>
        <span class="caption-5" id="preset-hint">One tap comfort</span>
      </div>
      <div class="preset-grid" id="preset-grid">
        <button type="button" class="preset-btn button-xsm" data-preset="classic">Classic</button>
        <button type="button" class="preset-btn button-xsm" data-preset="gentle">Calm</button>
        <button type="button" class="preset-btn button-xsm" data-preset="focus">Focus</button>
      </div>
    </section>

    <section class="card" aria-labelledby="font-heading">
      <div class="card-head">
        <h2 class="title-4" id="font-heading">Reading Font</h2>
      </div>
      <div class="font-grid" id="font-grid">
        <button type="button" class="font-btn" data-font="opendyslexic">
          <span class="font-sample font-sample-od">Aa</span>
          <span class="caption-3">OpenDyslexic</span>
        </button>
        <button type="button" class="font-btn" data-font="lexend">
          <span class="font-sample font-sample-lexend">Aa</span>
          <span class="caption-3">Lexend</span>
        </button>
        <button type="button" class="font-btn" data-font="atkinson">
          <span class="font-sample font-sample-atkinson">Aa</span>
          <span class="caption-3">Atkinson</span>
        </button>
        <button type="button" class="font-btn" data-font="sans">
          <span class="font-sample font-sample-sans">Aa</span>
          <span class="caption-3">Clean Sans</span>
        </button>
      </div>
    </section>

    <section class="card" aria-labelledby="theme-heading">
      <div class="card-head">
        <h2 class="title-4" id="theme-heading">Paper Tint</h2>
        <span class="caption-4" id="theme-name">Warm Cream</span>
      </div>
      <div class="swatch-row" id="swatch-row" role="radiogroup" aria-label="Paper tint">
        <!-- Populated by popup.js -->
      </div>
    </section>

    <section class="card" aria-labelledby="aids-heading">
      <div class="card-head">
        <h2 class="title-4" id="aids-heading">Reading Aids</h2>
      </div>
      <div class="toggle-list">
        <label class="toggle-row">
          <span class="toggle-copy">
            <span class="body-5">Reading Ruler</span>
            <span class="caption-5">Soft focus band that follows your line</span>
          </span>
          <input type="checkbox" class="mini-check" id="opt-ruler">
        </label>

        <label class="toggle-row">
          <span class="toggle-copy">
            <span class="body-5">Bold Word Anchors</span>
            <span class="caption-5">Highlights word starts to guide your eyes</span>
          </span>
          <input type="checkbox" class="mini-check" id="opt-bionic">
        </label>

        <label class="toggle-row">
          <span class="toggle-copy">
            <span class="body-5">Short Paragraphs</span>
            <span class="caption-5">Splits long blocks into calmer chunks</span>
          </span>
          <input type="checkbox" class="mini-check" id="opt-chunk">
        </label>

        <label class="toggle-row">
          <span class="toggle-copy">
            <span class="body-5">Left Align and No Italics</span>
            <span class="caption-5">Removes slanted text and uneven gaps</span>
          </span>
          <input type="checkbox" class="mini-check" id="opt-clean-text">
        </label>
      </div>
    </section>

    <details class="card fine-tune">
      <summary class="fine-tune-summary title-4">
        <span>Fine Tune Spacing and Defaults</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </summary>

      <div class="slider-stack">
        <label class="slider-item">
          <span class="slider-label">
            <span class="body-5">Text Size</span>
            <span class="caption-3" id="val-font-size">108%</span>
          </span>
          <input type="range" id="range-font-size" min="100" max="145" step="2">
        </label>

        <label class="slider-item">
          <span class="slider-label">
            <span class="body-5">Letter Spacing</span>
            <span class="caption-3" id="val-letter">0.06em</span>
          </span>
          <input type="range" id="range-letter" min="0" max="0.20" step="0.01">
        </label>

        <label class="slider-item">
          <span class="slider-label">
            <span class="body-5">Word Spacing</span>
            <span class="caption-3" id="val-word">0.18em</span>
          </span>
          <input type="range" id="range-word" min="0" max="0.44" step="0.02">
        </label>

        <label class="slider-item">
          <span class="slider-label">
            <span class="body-5">Line Height</span>
            <span class="caption-3" id="val-line">1.75</span>
          </span>
          <input type="range" id="range-line" min="1.4" max="2.3" step="0.05">
        </label>

        <label class="slider-item">
          <span class="slider-label">
            <span class="body-5">Ruler Band Height</span>
            <span class="caption-3" id="val-ruler-height">44px</span>
          </span>
          <input type="range" id="range-ruler-height" min="28" max="88" step="4">
        </label>

        <label class="slider-item">
          <span class="slider-label">
            <span class="body-5">Soft Screen Veil</span>
            <span class="caption-3" id="val-tint">0%</span>
          </span>
          <input type="range" id="range-tint" min="0" max="0.22" step="0.02">
        </label>

        <label class="toggle-row divider-top">
          <span class="toggle-copy">
            <span class="body-5">Auto Enable Everywhere</span>
            <span class="caption-5">Apply automatically on every webpage</span>
          </span>
          <input type="checkbox" class="mini-check" id="opt-auto">
        </label>

        <div class="footer-actions">
          <button type="button" class="ghost-btn button-xsm" id="btn-reset">Reset to Classic</button>
          <span class="caption-5">Option + D toggles page</span>
        </div>
      </div>
    </details>
  </main>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
